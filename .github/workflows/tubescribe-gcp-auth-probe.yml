name: TubeScribe GCP Auth Probe

on:
  push:
    branches:
      - ops/tubescribe-restore-20260901
    paths:
      - '.github/workflows/tubescribe-gcp-auth-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate with Google Workload Identity
        uses: google-github-actions/auth@v3
        with:
          project_id: buildmybot-507112
          workload_identity_provider: projects/406797137160/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: buildmybotsa@buildmybot-507112.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify read-only access
        shell: bash
        run: |
          set -euo pipefail
          project_id="$(gcloud config get-value project 2>/dev/null)"
          if [[ "$project_id" != "buildmybot-507112" ]]; then
            echo "Unexpected GCP project context" >&2
            exit 2
          fi
          gcloud projects describe "$project_id" --format='value(projectId)' | grep -Fx "$project_id" >/dev/null
          echo "Google Cloud workload identity is authorized for TubeScribe."
