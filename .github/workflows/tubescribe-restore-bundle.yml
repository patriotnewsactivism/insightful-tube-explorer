name: TubeScribe Restore Bundle

on:
  push:
    branches:
      - ops/tubescribe-restore-20260901
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production frontend
        env:
          VITE_SUPABASE_URL: https://wrsrjnqolfytzwbgbkgb.supabase.co
          VITE_SUPABASE_PROJECT_ID: wrsrjnqolfytzwbgbkgb
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_cQxsn-nGqKvV0ytPnOk8-g_wzRKoyvy
        run: npm run build

      - name: Verify output
        run: |
          test -f dist/index.html
          test -n "$(find dist -type f -name '*.js' -print -quit)"
          echo "Built files: $(find dist -type f | wc -l)"

      - name: Package source
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=dist \
            -czf /tmp/tubescribe-source.tar.gz .

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: tubescribe-dist
          path: dist/
          retention-days: 1

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: tubescribe-source
          path: /tmp/tubescribe-source.tar.gz
          retention-days: 1
